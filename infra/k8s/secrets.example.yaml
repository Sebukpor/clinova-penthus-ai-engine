# ============================================
# Clinova Penthus AI Engine - Secrets Template
#
# WARNING: This is an example file. Do NOT commit real secrets.
# In production, use OCI Vault or external secrets operator.
# Apply with: kubectl apply -k or use SealedSecrets/External Secrets Operator
# ============================================

apiVersion: v1
kind: Secret
metadata:
  name: clinova-penthus-secrets
  namespace: clinova
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql+asyncpg://penthus:CHANGEME@postgres:5432/clinova"
  SYNC_DATABASE_URL: "postgresql://penthus:CHANGEME@postgres:5432/clinova"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # vLLM / Hugging Face
  VLLM_BASE_URL: "http://penthus-vllm:8000/v1"
  VLLM_API_KEY: ""
  HF_TOKEN: "hf_CHANGEME"  # Hugging Face token for private model

  # Security
  SECRET_KEY: "CHANGEME-256-bit-secret-key-here"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  API_KEY_HEADER: "X-API-Key"

  # Object Storage (OCI)
  OBJECT_STORAGE_ENDPOINT: "https://namespace.compat.objectstorage.region.oraclecloud.com"
  OBJECT_STORAGE_ACCESS_KEY: "CHANGEME"
  OBJECT_STORAGE_SECRET_KEY: "CHANGEME"
  OBJECT_STORAGE_REGION: "us-ashburn-1"
  OBJECT_STORAGE_BUCKET: "clinova-documents"

  # Terminology Gateway
  TERMINOLOGY_GATEWAY_URL: "http://terminology-gateway:8080"

  # FHIR
  FHIR_BASE_URL: "http://fhir-server:8080/fhir"

  # OpenTelemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
---
# OCI Vault Secret Provider Class (for external-secrets operator)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oci-vault-penthus
  namespace: clinova
spec:
  provider: oracle
  parameters:
    vaultId: "ocid1.vault.oc1..CHANGEME"
    authType: instance
  secretObjects:
    - secretName: clinova-penthus-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: redis-url
          key: REDIS_URL
        - objectName: hf-token
          key: HF_TOKEN
        - objectName: secret-key
          key: SECRET_KEY
