apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinova-ingress
  namespace: clinova
  annotations:
    # OCI Load Balancer annotations
    oci.oraclecloud.com/load-balancer-type: "lb"
    oci.oraclecloud.com/oci-network-security-groups: "ocid1.networksecuritygroup.oc1..CHANGEME"
    # TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # SSL redirection
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-API-Key, X-Request-ID, X-Tenant-ID"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "5"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - clinova-api.dasmedhub.com
      secretName: clinova-api-tls
  rules:
    - host: clinova-api.dasmedhub.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: clinova-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: clinova-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: clinova-api
                port:
                  number: 8000
---
# Internal ingress for vLLM (no public access)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: penthus-vllm-internal
  namespace: clinova
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Only allow internal traffic
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8"
spec:
  ingressClassName: nginx-internal
  rules:
    - host: penthus-vllm.clinova.svc.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: penthus-vllm
                port:
                  number: 8000
