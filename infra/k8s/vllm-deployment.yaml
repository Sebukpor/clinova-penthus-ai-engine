apiVersion: apps/v1
kind: Deployment
metadata:
  name: penthus-vllm
  namespace: clinova
  labels:
    app: penthus-vllm
    tier: gpu
    component: model-service
spec:
  replicas: 1  # Scale based on GPU availability
  selector:
    matchLabels:
      app: penthus-vllm
  template:
    metadata:
      labels:
        app: penthus-vllm
        tier: gpu
    spec:
      nodeSelector:
        node-type: gpu  # Target GPU node pool
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      serviceAccountName: penthus-vllm
      initContainers:
        # Init container to download model from OCI Object Storage
        - name: model-downloader
          image: iad.ocir.io/NAMESPACE/clinova/model-downloader:1.0
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /models/Sebukpor/medical-document-understanding-v2-fixed/config.json ]; then
                echo "Downloading model from OCI Object Storage..."
                oci os object bulk-download \
                  --namespace ${OCI_NAMESPACE} \
                  --bucket-name ${MODEL_BUCKET} \
                  --prefix Sebukpor/medical-document-understanding-v2-fixed/ \
                  --download-dir /models
              fi
              echo "Model download complete"
          env:
            - name: OCI_NAMESPACE
              value: "CHANGEME"
            - name: MODEL_BUCKET
              value: "clinova-models"
            - name: OCI_CLI_AUTH
              value: "instance_principal"
          volumeMounts:
            - name: model-storage
              mountPath: /models
          resources:
            limits:
              memory: "4Gi"
              cpu: "2000m"
      containers:
        - name: vllm
          image: iad.ocir.io/NAMESPACE/clinova/penthus-vllm:1.2.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clinova-penthus-secrets
                  key: HF_TOKEN
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
            - --model
            - /models/Sebukpor/medical-document-understanding-v2-fixed
            - --served-model-name
            - penthus-1.2-alpha-4b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            - --enable-prefix-caching
            - --trust-remote-code
          resources:
            requests:
              memory: "16Gi"
              cpu: "4000m"
              nvidia.com/gpu: "1"
            limits:
              memory: "32Gi"
              cpu: "8000m"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-storage
              mountPath: /models
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: penthus-model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: penthus-vllm
  namespace: clinova
  labels:
    app: penthus-vllm
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: penthus-vllm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: penthus-vllm
  namespace: clinova
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: penthus-model-pvc
  namespace: clinova
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv  # OCI Block Volume
  resources:
    requests:
      storage: 50Gi
---
# NetworkPolicy to restrict vLLM to internal traffic only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: penthus-vllm-network-policy
  namespace: clinova
spec:
  podSelector:
    matchLabels:
      app: penthus-vllm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: clinova-api
      ports:
        - protocol: TCP
          port: 8000
