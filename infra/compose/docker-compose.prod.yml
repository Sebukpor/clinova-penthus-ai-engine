# ============================================
# Clinova Penthus AI Engine - Production Docker Compose
# Single-host architecture for OCI VM deployment
# Optimized for production MVP deployment
# ============================================
# Architecture:
#   Internet -> Nginx -> FastAPI -> PostgreSQL + Redis + vLLM
# All services run on one OCI VM via Docker Compose
# ============================================

version: "3.8"

services:

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: penthus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - penthus-network
    restart: unless-stopped

  # ============================================
  # FastAPI Orchestrator
  # ============================================
  api:
    image: ${API_IMAGE:-penthus-api:local}
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: penthus-api

    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO

      DATABASE_URL: postgresql+asyncpg://penthus:${DB_PASSWORD}@postgres:5432/clinova
      REDIS_URL: redis://redis:6379/0

      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: penthus-1.2-alpha-4b

      SECRET_KEY: ${SECRET_KEY}

      API_WORKERS: "2"
      API_RELOAD: "false"

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - penthus-network
    restart: unless-stopped

  # ============================================
  # PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: penthus-postgres

    environment:
      POSTGRES_USER: penthus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: clinova

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - penthus-network
    restart: unless-stopped

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: penthus-redis

    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    networks:
      - penthus-network
    restart: unless-stopped

  # ============================================
  # vLLM (FIXED - STABLE CUDA COMPATIBLE)
  # ============================================
  vllm:
    image: vllm/vllm-openai:v0.6.6   # 🔥 IMPORTANT FIX (NOT latest)
    container_name: penthus-vllm

    ports:
      - "8001:8000"

    environment:
      HF_TOKEN: ${HF_TOKEN}
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_ENABLE_CUDA_COMPATIBILITY: "1"

    volumes:
      - vllm_cache:/root/.cache/huggingface

    gpus: all   # 🔥 REQUIRED for A10

    restart: unless-stopped

    networks:
      - penthus-network

    command: >
