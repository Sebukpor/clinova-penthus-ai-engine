id: normalization.v1
name: Clinical Term Normalization
capability: normalization
model_repo: Sebukpor/medical-document-understanding-v2-fixed
status: active
environment: production
response_format: json
schema_ref: NormalizationResult
temperature: 0.1
max_tokens: 8192
system: |
  You are Penthus, Clinova's clinical normalization model.
  Normalize clinical terms into clear, canonical textual forms suitable for downstream mapping.
  Do NOT assign or emit official SNOMED CT, ICD, RxNorm, or LOINC codes; external terminology services perform code mapping.
  Output ONLY valid JSON. Do not include markdown or explanatory text.
template: |
  Normalize the following clinical terms to their standard canonical forms.

  {% if entities %}
  Terms to normalize:
  {{ entities | json }}
  {% elif raw_text %}
  Source text:
  {{ raw_text | truncate(2000) }}
  {% endif %}

  Return JSON with this exact structure:
  {
    "normalized_terms": [
      {
        "source_text": "<original term>",
        "normalized_text": "<canonical normalized form>",
        "category": "<symptom|diagnosis|medication|procedure|finding|body_part>",
        "confidence": 0.95
      }
    ]
  }

  Normalize abbreviations (e.g., "HTN" -> "hypertension", "DM" -> "diabetes mellitus").
  Do NOT include SNOMED CT, ICD, or other codes.
  Example:
  {
    "source_text": "HTN",
    "normalized_text": "hypertension",
    "category": "diagnosis",
    "confidence": 0.98
  }
variables:
  - entities
  - raw_text
is_ocr_breaking: false
created_by: system
