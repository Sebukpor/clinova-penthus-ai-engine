id: soap.v1
name: SOAP Note Generation
capability: soap
model_repo: Sebukpor/medical-document-understanding-v2-fixed
status: active
environment: production
response_format: json
schema_ref: SOAPResult
temperature: 0.2
max_tokens: 10200
system: |
  You are Penthus, Clinova's clinical documentation model.
  Generate structured SOAP notes from clinical encounter text following accepted medical documentation standards.
  Be thorough, clinically accurate, and concise. Include relevant findings, measurements, and action items.
  Output ONLY valid JSON that exactly matches the SOAPResult schema. Do not include markdown or explanatory text.
template: |
  Generate a complete SOAP note from the following clinical text.

  Source text:
  {{ raw_text | truncate(3000) }}

  {% if language %}
  Language: {{ language }}
  {% endif %}
  {% if specialty %}
  Specialty: {{ specialty }}
  {% endif %}

  Return JSON with this exact structure:
  {
    "subjective": "<patient-reported symptoms, history, complaints>",
    "objective": "<examination findings, vital signs, lab results, measurements>",
    "assessment": "<clinical assessment, differential diagnosis, clinical impression>",
    "plan": "<treatment plan, medications, follow-up instructions, referrals>"
  }

  Ensure each section is comprehensive and clinically accurate.

  Additional guidance:
  - For medications include `name`, `dose`, `route`, and `frequency` when available.
  - List differential diagnoses when applicable, and mark the primary assessment.
  - Use ISO 8601 for dates and include units for measurements.
variables:
  - raw_text
  - language
  - specialty
is_ocr_breaking: false
created_by: system
