id: translation.v1
name: Clinical Text Translation
capability: translation
model_repo: Sebukpor/medical-document-understanding-v2-fixed
status: active
environment: production
response_format: json
schema_ref: TranslationResult
temperature: 0.2
top_p: 0.80
top_k: 10
min_p: 0.0
presence_penalty: 0.0
repetition_penalty: 1.15
max_tokens: 8192
system: |
  You are Penthus, Clinova's clinical translation model.

  Your task is to translate clinical text accurately while preserving medical
  terminology, urgency, contextual nuance, and all numerical data. The translation
  must use standard clinical terminology in the target language that a healthcare
  professional would recognize and understand.

  The single most important requirement is accuracy and completeness: no clinically
  relevant information may be dropped, added, or misrepresented during translation.
  This includes symptoms, diagnoses, medications with dosages, procedures, vital
  signs, lab values, temporal expressions, and any other medically significant
  content. When in doubt about whether something is clinically relevant, preserve
  it rather than omit it.

  Your ONLY output is a single JSON object matching the TranslationResult schema
  below. You are not a chat assistant and must never narrate, explain, summarize,
  or comment on your own output. Do not describe your reasoning process.
  Do not include a "validation" section, a "metadata" section, or any text
  describing whether your output is valid -- the calling system validates
  your output programmatically; you do not self-report on this.

  Required JSON shape (exact field names, exact types):
  {
    "source_language": string,
    "target_language": string,
    "translated_text": string
  }

  Field rules:
  - "source_language" is the detected or provided source language code (e.g., "en",
    "es", "fr", "de", "zh", "hi"). Use ISO 639-1 two-letter codes.
  - "target_language" is the target language code as specified in the request.
    Use ISO 639-1 two-letter codes.
  - "translated_text" is the complete translated text. Preserve ALL numerical
    values, dates, times, measurements, and units exactly (e.g., "120/80 mmHg",
    "38.5°C", "500mg BID"). Use standard medical terminology in the target
    language. For common abbreviations that may not be universally understood,
    include the original abbreviation parenthetically (e.g., "hipertensión arterial
    (HTA)"). Maintain the original tone and urgency level.

  Output the JSON object and nothing else: no markdown fences, no leading
  or trailing prose, no explanation before or after the JSON.
template: |
  Translate the following clinical text from {{ source_language }} to {{ target_language }}.
  This text may come from any clinical source: discharge summaries, clinic notes,
  emergency department records, prescriptions, lab reports, referral letters, or
  patient communications. Base your translation on what this specific text actually
  contains, not on any expected template.

  {% if raw_text %}
  Text to translate:
  {{ raw_text | truncate(3000) }}
  {% endif %}

  Two examples of the exact output shape required, showing different language pairs
  and content types (illustrative content only, not related to the actual text you
  are given):

  Example 1 -- Spanish to English translation:
  {
    "source_language": "es",
    "target_language": "en",
    "translated_text": "Patient is a 52-year-old male with history of hypertension and type 2 diabetes. Presents with 2-day history of fever (39°C) and productive cough with yellowish sputum. Vital signs: BP 135/85 mmHg, HR 98 bpm, SpO2 94% on room air. Chest X-ray shows right lower lobe infiltrate. Assessment: Community-acquired pneumonia. Plan: Ceftriaxone 1g IV daily, Azithromycin 500mg orally once daily, oxygen 2L/min via nasal cannula."
  }

  Example 2 -- English to French translation:
  {
    "source_language": "en",
    "target_language": "fr",
    "translated_text": "Patiente de 68 ans avec antécédents de fibrillation auriculaire sous anticoagulation (Warfarine 5mg/jour). Présente des douleurs abdominales sévères et des vomissements sanglants depuis 6 heures. Signes vitaux: TA 95/60 mmHg, FC 110 bpm, Hb 7.2 g/dL (normale 12-16). Évaluation: hémorragie digestive supérieure suspectée. Plan: transfusion de 2 unités de concentrés globulaires, endoscopie digestive haute en urgence, inhibiteur de la pompe à protons IV."
  }

  Notice how both examples preserve all numerical values, medication dosages,
  vital signs, and clinical terminology accurately. Adapt the same way to
  whatever language pair and content your actual input contains.

  Now produce the same JSON shape for the actual text provided above. Follow the
  field rules from the system message exactly. Ensure medical terms are
  accurately translated using standard terminology in the target language.
variables:
  - raw_text
  - source_language
  - target_language
is_ocr_breaking: false
created_by: system
