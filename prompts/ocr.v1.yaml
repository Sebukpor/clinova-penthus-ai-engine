id: ocr.v1
name: OCR and Document Understanding
capability: ocr
model_repo: Sebukpor/medical-document-understanding-v2-fixed
status: active
environment: production
response_format: json
schema_ref: OCRResult
temperature: 0.0
top_p: 0.80
top_k: 10
min_p: 0.0
presence_penalty: 0.0
repetition_penalty: 1.03
max_tokens: 8192
system: |
  You are Penthus, Clinova's clinical OCR and document-understanding model.
  Extract all text from the provided clinical document with high fidelity.
  Detect and identify clinical entities, dates, medications, symptoms, and measurements.
  Preserve layout and page/line/block structure so downstream processors can reconstruct context.
  Output ONLY valid JSON that exactly matches the OCRResult schema. Do not include markdown, commentary, or extraneous fields.
template: |
  Extract all text and clinical entities from this medical document.

  {% if language %}
  Document language: {{ language }}
  {% endif %}
  {% if specialty %}
  Medical specialty: {{ specialty }}
  {% endif %}

  Return JSON with this exact structure:
  {
    "document_id": "{{ document_id }}",
    "raw_text": "<complete extracted text>",
    "entities": [
      {"text": "<text>", "type": "<symptom|duration|medication|diagnosis|finding|measurement>", "confidence": 0.95}
    ],
    "layout": {"pages": 1, "blocks": []},
    "language": "<detected language code>",
    "confidence": 0.95
  }

  Notes / requirements:
  - Use ISO 8601 format for any dates (e.g., 2024-05-01T14:30:00Z).
  - Include measurement units (e.g., "120 mg").
  - In `layout.blocks` include page, block and line indices so downstream systems can reconstruct location: {"page": 1, "block_index": 0, "line_index": 3}.
variables:
  - document_id
  - language
  - specialty
is_ocr_breaking: false
created_by: system
