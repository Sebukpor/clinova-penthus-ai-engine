name: Build and Push to OCIR

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  OCIR_REGISTRY: ${{ secrets.OCIR_REGISTRY }}
  OCIR_REPOSITORY: ${{ secrets.OCIR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push Docker images to OCIR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to OCIR
        run: |
          echo "Logging into $OCIR_REGISTRY"
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login $OCIR_REGISTRY -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

      - name: Build and push API image
        run: |
          IMAGE=${OCIR_REGISTRY}/${OCIR_REPOSITORY}:api-${IMAGE_TAG}
          docker build -f infra/docker/api.Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Set outputs
        id: out
        run: echo "api_image=${OCIR_REGISTRY}/${OCIR_REPOSITORY}:api-${IMAGE_TAG}" >> $GITHUB_OUTPUT
